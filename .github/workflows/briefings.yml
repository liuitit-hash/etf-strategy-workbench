name: briefings

# 三条定时（UTC）。北京时间 = UTC+8：
#   盘前 08:40 CST = 00:40 UTC
#   盘中 13:30 CST = 05:30 UTC
#   盘后 15:40 CST = 07:40 UTC
# 注意：GitHub 定时任务为"尽力而为"，可能延迟 5~15 分钟；仓库连续 60 天无提交，
#       定时会被自动停用——用下方 keepalive 工作流或偶尔手动 dispatch 保活。
#       交易日/节假日判断由脚本内部用 akshare 交易日历完成，非交易日自动跳过。

on:
  schedule:
    - cron: "40 0 * * 1-5"   # pre
    - cron: "30 5 * * 1-5"   # intra
    - cron: "40 7 * * 1-5"   # post
  workflow_dispatch:
    inputs:
      type:
        description: "手动生成的简报类型"
        type: choice
        options: [pre, intra, post]
        default: post
      force:
        description: "跳过交易日判断（手动复盘用）"
        type: boolean
        default: true

concurrency:
  group: briefings
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r jobs/requirements.txt

      - name: Decide briefing module
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            T="${{ github.event.inputs.type }}"
          else
            case "${{ github.event.schedule }}" in
              "40 0 * * 1-5") T=pre ;;
              "30 5 * * 1-5") T=intra ;;
              "40 7 * * 1-5") T=post ;;
              *) T=post ;;
            esac
          fi
          case "$T" in
            pre)   M=premarket ;;
            intra) M=intraday ;;
            post)  M=postmarket ;;
            *)     M=postmarket ;;
          esac
          echo "mod=$M" >> "$GITHUB_OUTPUT"
          echo "将运行：jobs.$M"

      - name: Generate briefing
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_TEMPERATURE: ${{ vars.LLM_TEMPERATURE }}
          MARKET: ${{ vars.MARKET }}
          TZ: Asia/Shanghai
        run: |
          ARG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARG="force"
          fi
          python -m jobs.${{ steps.decide.outputs.mod }} $ARG
